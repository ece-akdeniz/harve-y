[project]
name = "tacto-negotiator"
version = "0.1.0"
description = "Buyer agent for the Tacto Negotiation Arena (EHL Grand Finale 2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arena-kit[anthropic,sim]",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[project.scripts]
negotiator = "negotiator.cli:main"

[tool.uv.sources]
arena-kit = { git = "https://github.com/tacto-ai/negotiation-arena-kit", subdirectory = "starter-kit" }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/negotiator"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
